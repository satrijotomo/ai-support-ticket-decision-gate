services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  durable-task-scheduler:
    image: mcr.microsoft.com/dts/dts-emulator:latest
    profiles:
      - dts
    ports:
      - "8080:8080"
      - "8082:8082"

volumes:
  azurite-data: