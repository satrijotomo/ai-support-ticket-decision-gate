[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-ticket-decision-gate"
version = "0.1.0"
description = "A human-gated AI support ticket decision workflow proof of concept."
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]